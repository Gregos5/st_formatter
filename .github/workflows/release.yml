name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/st_formatter/__init__.py').read()).group(1))")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION does not match package version $PKG_VERSION"
            exit 1
          fi

  build-sdist-wheel:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist-wheel
          path: dist/*

  publish-pypi:
    needs: build-sdist-wheel
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-sdist-wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  build-executables:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: linux-x86_64
          - os: windows-latest
            asset_name: windows-x86_64
          - os: macos-latest
            asset_name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .[build]
      - run: pyinstaller --onefile --name st-formatter packaging/pyinstaller_entry.py
      - name: Smoke test
        shell: bash
        run: |
          if [ -f dist/st-formatter.exe ]; then
            ./dist/st-formatter.exe --version
          else
            ./dist/st-formatter --version
          fi
      - name: Package artifact
        shell: bash
        run: |
          cd dist
          TAG="${GITHUB_REF_NAME}"
          if [ -f st-formatter.exe ]; then
            OUT="st-formatter-${TAG}-${{ matrix.asset_name }}.exe"
            mv st-formatter.exe "$OUT"
          else
            OUT="st-formatter-${TAG}-${{ matrix.asset_name }}"
            mv st-formatter "$OUT"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$OUT" > "$OUT.sha256"
          else
            shasum -a 256 "$OUT" > "$OUT.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-executable-${{ matrix.asset_name }}
          path: |
            dist/st-formatter-*

  github-release:
    needs: [publish-pypi, build-executables]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
