# Example st_formatter config. Place a copy of this file (named
# `.stformat.toml`) at the root of your project, or add the equivalent
# `[tool.st_formatter]` table to your project's own pyproject.toml.
#
# st-formatter looks for `.stformat.toml` first, then falls back to a
# `[tool.st_formatter]` table in pyproject.toml, walking upward from the
# file/directory you point it at. Any CLI flag you pass overrides these
# values.

indent_size = 2
tab_width = 4
indent = true
align = true
extensions = [".st", ".exp"]
exclude = ["**/build/**", "**/_generated/**"]

# Bodas-design-specific normalization, both off by default:
# action_separator: "space" or "tab" normalizes the whitespace between
#   ACTION and its name; leave unset to keep it exactly as written.
# trim_trailing_blank_lines: drop blank lines right before
#   END_ACTION/END_PROGRAM/END_FUNCTION/END_FUNCTION_BLOCK.
# action_separator = "tab"
# trim_trailing_blank_lines = true
